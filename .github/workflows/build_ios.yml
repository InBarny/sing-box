name: Build iOS XCFramework

on:
  workflow_dispatch: # Ручной запуск кнопкой

jobs:
  build:
    runs-on: macos-latest # Бесплатный раннер от GitHub с macOS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Актуальная версия для sing-box

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build XCFramework
        run: |
          cd ios
          # Собираем под все архитектуры iOS и симулятора
          gomobile bind -target=ios,iossimulator -o SingBox.xcframework ./experimental/libcore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingBox.xcframework
          path: ios/SingBox.xcframework
